<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alice Manabiba</title>
<style>
  @font-face{font-family:"Fell";src:url(fonts/im-fell-english-latin-400-normal.woff2) format("woff2");font-display:block}
  @font-face{font-family:"Fell";font-style:italic;src:url(fonts/im-fell-english-latin-400-italic.woff2) format("woff2");font-display:block}
  @font-face{font-family:"Fell SC";src:url(fonts/im-fell-english-sc-latin-400-normal.woff2) format("woff2");font-display:block}
  :root{
    --ink:#2e2016; --red:#b9382f; --blue:#5f93c8; --gold:#e0ab35; --gold2:#b98422; --green:#7aa35a; --paper:#fbf3df; --rose:#b9382f;
    --serif:"Fell", Georgia, "Times New Roman", serif; --title:"Fell SC", "Fell", Georgia, serif;
    --lift:4px 5px 0 rgba(46,32,22,.35);
    --focus:0 0 0 5px var(--red), 0 0 0 9px #ffe08a, 0 0 30px 14px rgba(255,205,80,.95);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#24170e;font-family:var(--serif);color:var(--ink);
    -webkit-user-select:none;user-select:none;cursor:default}
  #stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#f3e6c8}
  .screen{position:absolute;inset:0;display:none}
  .screen.on{display:block}
  .hrt{color:var(--red);font-family:Georgia,serif}

  /* ---------- the page: old paper, watercolor washes, a ruled border ---------- */
  .sky{position:absolute;inset:0;background:url(art/paper.jpg) center/cover}
  .sky::before{content:"";position:absolute;inset:0;background:
      radial-gradient(ellipse 42% 48% at 50% 38%, rgba(110,165,215,.34), transparent 72%),
      radial-gradient(ellipse 30% 42% at 6% 22%, rgba(222,120,130,.30), transparent 70%),
      radial-gradient(ellipse 30% 42% at 95% 24%, rgba(232,180,70,.30), transparent 70%),
      radial-gradient(ellipse 34% 40% at 10% 88%, rgba(130,175,105,.32), transparent 70%),
      radial-gradient(ellipse 34% 40% at 92% 86%, rgba(150,120,190,.26), transparent 70%)}
  .sky::after{content:"";position:absolute;inset:10px;border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-7px;border-radius:3px;opacity:.75;pointer-events:none}
  .floor,.sparkles,.decor,#fan,.crest{display:none}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
  .art{position:absolute;pointer-events:none}

  .ribbon{position:absolute;padding:6px 30px;background:var(--red);color:#fff6dd;font-family:var(--title);font-size:40px;
      border:2px solid var(--ink);border-radius:4px;box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 4px rgba(255,240,200,.55),var(--lift);white-space:nowrap;letter-spacing:1px}
  .pill{position:absolute;padding:8px 22px;border-radius:10px;background:var(--paper);border:2px solid var(--ink);
      font-size:30px;color:var(--ink);white-space:nowrap;box-shadow:var(--lift)}

  /* focus ring used everywhere */
  .fx{transition:transform .15s ease, box-shadow .15s ease, filter .15s}
  .fx.focus{z-index:50}
  .btn{position:absolute;display:flex;align-items:center;gap:14px;justify-content:center;
      padding:12px 30px;border-radius:14px;background:var(--paper);border:3px solid var(--ink);font-size:32px;color:var(--ink);
      box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px rgba(46,32,22,.35),var(--lift);white-space:nowrap}
  .btn .key{display:inline-flex;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff6dd;border:2px solid var(--ink);
      align-items:center;justify-content:center;font-size:24px}
  .btn.focus{transform:scale(1.12);box-shadow:var(--focus)}
  .btn.busy{filter:saturate(.4) brightness(.95)}

  /* ---------- title ---------- */
  #titleArt{left:56px;top:54px;height:800px}
  #title .logo{position:absolute;left:690px;right:40px;top:58px;text-align:center;font-family:var(--title);
      font-size:112px;color:var(--red);line-height:1;letter-spacing:2px;text-shadow:3px 4px 0 rgba(46,32,22,.22)}
  #title .sub{position:absolute;left:690px;right:40px;top:186px;text-align:center;font-size:40px;font-style:italic}
  #titleCameo{position:absolute;left:985px;top:262px;width:280px;height:400px;border-radius:50%;border:3px solid var(--ink);
      background:radial-gradient(ellipse at 45% 35%,#fdfaf0,#d4e6f1 60%,#9cc3de);box-shadow:inset 0 0 0 8px var(--gold),inset 0 0 0 10px var(--ink),var(--lift)}
  #titleAlice{position:absolute;left:1040px;top:280px;width:170px;animation:bob 5s infinite ease-in-out}
  #titleRabbit{left:1300px;top:290px;height:370px}
  #titleHatter{left:712px;top:420px;height:230px}
  #btnPlay{left:965px;top:690px;width:320px;font-size:46px;background:var(--red);color:#fff6dd;font-family:var(--title);
      box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 4px rgba(255,240,200,.6),var(--lift)}
  #btnPlay.focus{box-shadow:var(--focus)}
  #btnReset{left:835px;top:800px;width:280px;font-size:26px;padding:8px 16px}
  #btnMusic{left:1135px;top:800px;width:280px;font-size:26px;padding:8px 16px}
  body.app #btnReset{left:700px} body.app #btnMusic{left:990px}
  #btnFolder{left:1280px;top:800px;width:270px;font-size:26px;padding:8px 16px;display:none}
  body.app #btnFolder{display:flex}

  /* ---------- playing cards ---------- */
  .card{position:absolute;width:92px;height:128px;border-radius:9px;
      background:linear-gradient(160deg,#fffdf4,#f6ecd2);border:2px solid var(--ink);box-shadow:3px 4px 0 rgba(46,32,22,.32);
      transform:rotate(var(--rot,0deg)) scale(var(--sc,1));transition:transform .15s, left .55s ease, top .55s ease, opacity .3s}
  .card.red{color:var(--red)}.card.black{color:#241a12}
  .card .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px;font-family:var(--serif);line-height:1}
  .card .tl,.card .br{position:absolute;font-size:17px;line-height:.95;text-align:center;width:20px}
  .card .tl{left:5px;top:5px}.card .br{right:5px;bottom:5px;transform:rotate(180deg)}
  .card::after{content:"";position:absolute;inset:5px;border-radius:5px;border:1px solid currentColor;opacity:.4;pointer-events:none}
  .card.focus{--sc:1.22;box-shadow:var(--focus)}
  .card.wrong{animation:wiggle .45s}
  @keyframes wiggle{0%,100%{transform:rotate(var(--rot)) scale(var(--sc,1))}20%{transform:rotate(calc(var(--rot) - 12deg)) scale(var(--sc,1))}
      40%{transform:rotate(calc(var(--rot) + 12deg)) scale(var(--sc,1))}60%{transform:rotate(calc(var(--rot) - 8deg)) scale(var(--sc,1))}80%{transform:rotate(calc(var(--rot) + 6deg)) scale(var(--sc,1))}}
  .card.pic{width:150px;height:210px;border-radius:12px}
  .card.pic .mid{font-size:104px;filter:saturate(.9) sepia(.12)}
  .card.pic .tl,.card.pic .br{font-size:28px;width:30px}
  .card.flying{z-index:80;--rot:0deg;--sc:.8;box-shadow:0 0 30px 10px #ffe08a}
  .card.gone{display:none}

  /* ---------- level ---------- */
  #lvlArtL,#lvlArtR{opacity:.9}
  #mirror{position:absolute;left:560px;top:108px;width:480px;height:420px}
  #mirror::before,#wardMirror::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--ink);box-shadow:var(--lift)}
  #mirror .glass, #wardMirror .glass{position:absolute;inset:24px;border-radius:50%;
      background:radial-gradient(ellipse at 40% 30%,#fffdf5 0%,#dcebf2 50%,#a3c7df 100%);box-shadow:0 0 0 3px var(--ink), inset 0 0 40px rgba(60,100,150,.35)}
  #mirror .frame, #wardMirror .frame{position:absolute;inset:0;border-radius:50%;border:24px solid transparent;
      background:repeating-linear-gradient(45deg,rgba(46,32,22,.16) 0 2px,transparent 2px 7px) border-box,linear-gradient(160deg,#f3d27a,#d09a2c 40%,#f0cf73 60%,#b07f22) border-box;
      -webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);
      mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0)}
  #pic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:230px;line-height:1;
      filter:saturate(.9) sepia(.12) drop-shadow(4px 6px 0 rgba(46,32,22,.18))}
  #pic.pop{animation:pop .6s}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  #slots{position:absolute;left:500px;width:600px;top:552px;height:110px}
  .slot{position:absolute;width:78px;height:100px;display:flex;align-items:center;justify-content:center;border-radius:10px;
      font-size:80px;color:var(--ink);font-family:var(--title)}
  .slot::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:6px;border-radius:3px;background:var(--ink)}
  .slot.next::after{background:var(--red);animation:glow 1.2s infinite}
  .slot.hl{transform:scale(1.25);transition:transform .15s;background:rgba(255,214,90,.75);box-shadow:0 0 0 3px var(--red)}
  .slot.hl.filled{color:var(--red)}
  @keyframes glow{50%{box-shadow:0 0 14px 6px #ffd65a}}
  #btnHint1{left:520px;top:712px;width:270px;background:#d5e6f3;box-shadow:inset 0 0 0 3px #d5e6f3,inset 0 0 0 4px rgba(46,32,22,.35),var(--lift)}
  #btnHint2{left:810px;top:712px;width:270px;background:#f7e2a6;box-shadow:inset 0 0 0 3px #f7e2a6,inset 0 0 0 4px rgba(46,32,22,.35),var(--lift)}
  #btnHint1.focus,#btnHint2.focus{box-shadow:var(--focus)}
  #btnMap{left:28px;top:24px;padding:6px 18px;font-size:24px}
  #lvlTitle{left:600px;top:26px;width:400px;text-align:center;font-size:24px;padding:6px 10px;font-style:italic}
  #lvlPoints, #mapPoints{right:28px;top:24px}

  /* ---------- map ---------- */
  #mapWorld{position:absolute;left:0;top:0;height:900px;transition:transform .7s ease}
  .region{position:absolute;top:0;height:900px}
  .land{position:absolute;pointer-events:none}
  .wbanner{position:absolute;top:96px;transform:translateX(-50%);font-size:34px}
  .node{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fffdf4,#f4e3b6);border:4px solid var(--ink);
      display:flex;align-items:center;justify-content:center;font-size:46px;font-family:var(--title);color:var(--ink);
      box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 0 5px var(--ink),var(--lift)}
  .node.locked{background:repeating-linear-gradient(45deg,rgba(46,32,22,.22) 0 2px,transparent 2px 7px),#d9ccb0;box-shadow:var(--lift)}
  .node.locked svg{width:40px;height:40px}
  .node.done{background:radial-gradient(circle at 35% 30%,#fffdf4,#f8d2c8);box-shadow:inset 0 0 0 4px var(--red),inset 0 0 0 5px var(--ink),var(--lift);font-size:50px}
  .node .stars{position:absolute;top:96px;left:50%;transform:translateX(-50%);font-size:26px;white-space:nowrap;color:var(--gold);-webkit-text-stroke:1.5px var(--ink);font-family:Georgia,serif}
  .node .badge{position:absolute;right:-16px;top:-16px;width:30px;height:42px;border-radius:4px;background:#fffdf4;border:2px solid var(--ink);color:var(--red);
      font-size:24px;line-height:38px;text-align:center;transform:rotate(12deg);font-family:Georgia,serif;box-shadow:2px 2px 0 rgba(46,32,22,.3)}
  .node.sel{box-shadow:var(--focus);transform:scale(1.15)}
  .node.current:not(.sel){animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 5px var(--red),0 0 24px 10px #ffd65a}}
  #mapAlice{position:absolute;width:90px;margin:-212px 0 0 -45px;transition:left .8s ease, top .8s ease;z-index:20;pointer-events:none;
      filter:drop-shadow(3px 5px 0 rgba(46,32,22,.3))}
  #mapAlice.hop{animation:hop .4s 2}
  @keyframes hop{50%{transform:translateY(-30px)}}
  #mapHelp{left:50%;bottom:26px;transform:translateX(-50%);font-size:24px;font-style:italic}
  #btnWardrobe{left:28px;top:808px;font-size:28px;padding:8px 26px;background:#d5e6f3;box-shadow:inset 0 0 0 3px #d5e6f3,inset 0 0 0 4px rgba(46,32,22,.35),var(--lift)}
  #btnWardrobe.focus{box-shadow:var(--focus)}
  #btnWardrobe.newstuff::after{content:"New!";position:absolute;right:-22px;top:-24px;background:var(--red);color:#fff6dd;font-size:20px;font-family:var(--title);
      padding:2px 12px;border-radius:6px;border:2px solid var(--ink);animation:bob 1.6s infinite ease-in-out}
  #mapLogo{left:28px;top:22px;font-size:40px}

  /* ---------- wardrobe ---------- */
  #wardMirror{position:absolute;left:46px;top:110px;width:490px;height:720px}
  #wardMirror::before{border-radius:46%}
  #wardMirror .glass{border-radius:46%}
  #wardMirror .frame{border-radius:46%}
  #wardAlice{position:absolute;left:115px;top:96px;width:260px;animation:bob 5s infinite ease-in-out}
  #wardTitle{left:640px;top:20px;font-size:42px}
  #btnWardBack{left:28px;top:24px;padding:6px 18px;font-size:24px}
  #wardPoints{right:28px;top:24px}
  #wardTabs{position:absolute;left:584px;top:112px;width:990px;height:80px}
  .tab{position:absolute;top:0;width:152px;height:74px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:var(--paper);border:3px solid var(--ink);font-size:20px;color:var(--ink);line-height:1.1;box-shadow:var(--lift)}
  .tab span{font-size:26px}
  .tab.active{background:var(--red);color:#fff6dd}
  .tab.focus{transform:scale(1.1);box-shadow:var(--focus)}
  #wardGrid{position:absolute;left:584px;top:212px;width:990px;height:600px}
  .tile{position:absolute;width:150px;height:186px;border-radius:10px;background:linear-gradient(160deg,#fffdf4,#f6ecd2);
      border:3px solid var(--ink);box-shadow:var(--lift);--rot:0deg;transform:rotate(var(--rot)) scale(var(--sc,1))}
  .tile .pv{position:absolute;left:10px;top:6px;width:124px;height:124px}
  .tile .pv svg{width:100%;height:100%}
  .tile .nm{position:absolute;top:128px;left:0;right:0;text-align:center;font-size:19px}
  .tile .pr{position:absolute;top:153px;left:0;right:0;text-align:center;font-size:18px;color:#6b4a35;font-style:italic}
  .tile.locked{background:repeating-linear-gradient(45deg,rgba(46,32,22,.07) 0 2px,transparent 2px 8px),#eadfc6}
  .tile.wearing{box-shadow:inset 0 0 0 4px var(--red),var(--lift)}
  .tile.focus{--sc:1.12;box-shadow:var(--focus)}
  .tile.wrong{animation:wiggle .45s}
  #wardMsg{left:584px;top:826px;width:990px;text-align:center;font-size:24px;white-space:normal;font-style:italic}

  /* ---------- celebration ---------- */
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
      background:radial-gradient(circle,rgba(251,243,223,.96) 30%,rgba(243,226,190,.86));z-index:200}
  #overlay.on{display:flex}
  #ovAlice{position:absolute;left:110px;bottom:40px;width:240px;animation:dance .7s infinite alternate ease-in-out}
  @keyframes dance{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-22px)}}
  #ovArt{right:70px;bottom:40px;height:430px}
  #ovBig{font-family:var(--title);font-size:120px;color:var(--red);text-shadow:4px 5px 0 rgba(46,32,22,.2);animation:pop .6s;max-width:1100px;text-align:center;line-height:1}
  #ovWord{font-family:var(--title);font-size:96px;letter-spacing:16px;color:#2f5f96;margin-top:14px}
  #ovStars{font-size:96px;margin-top:4px;min-height:110px;color:var(--gold);-webkit-text-stroke:3px var(--ink);font-family:Georgia,serif}
  #ovStars span{display:inline-block;animation:pop .5s both;margin:0 6px}
  #ovStars span.off{color:#e6dcc3}
  #ovPts{font-size:38px;font-style:italic;margin-top:2px}
  .confetti{position:absolute;top:-70px;width:36px;height:50px;border-radius:5px;background:#fffdf4;border:2px solid var(--ink);color:#241a12;
      font-size:28px;line-height:46px;text-align:center;font-family:Georgia,serif;animation:fall linear forwards;z-index:210;pointer-events:none;will-change:transform}
  .confetti.red{color:var(--red)}
  @keyframes fall{to{transform:translateY(1050px) rotate(540deg)}}
</style>
</head>
<body>
<div id="stage">

  <!-- ======================= TITLE ======================= -->
  <section id="title" class="screen">
    <div class="sky"></div>
    <img id="titleArt" class="art" src="art/cards.webp" alt="">
    <div class="logo">Alice Manabiba</div>
    <div class="sub">a Wonderland of words</div>
    <img id="titleHatter" class="art" src="art/hatter.webp" alt="">
    <div id="titleCameo"></div>
    <div id="titleAlice"></div>
    <img id="titleRabbit" class="art" src="art/rabbit.webp" alt="">
    <div id="fan"></div>
    <div id="btnPlay" class="btn fx" data-act="play">Play</div>
    <div id="btnReset" class="btn fx" data-act="reset">↺ Start over</div>
    <div id="btnMusic" class="btn fx" data-act="music">♪ Music: On</div>
    <div id="btnFolder" class="btn fx" data-act="folder">⚙ Music folder</div>
  </section>

  <!-- ======================= MAP ======================= -->
  <section id="map" class="screen">
    <div class="sky"></div>
    <div id="mapWorld"></div>
    <div id="mapLogo" class="ribbon">Alice Manabiba</div>
    <div id="mapPoints" class="pill"></div>
    <div id="mapHelp" class="pill">◀ ▶ choose a spot &nbsp;·&nbsp; OK to play &nbsp;·&nbsp; ▼ wardrobe</div>
    <div id="btnWardrobe" class="btn fx" data-act="wardrobe">👗 Wardrobe</div>
  </section>

  <!-- ======================= LEVEL ======================= -->
  <section id="level" class="screen">
    <div class="sky"></div>
    <div id="mirror"><div class="glass"></div><div id="pic"></div><div class="frame"></div></div>
    <div id="slots"></div>
    <div id="btnHint1" class="btn fx" data-act="hint1"><span class="key">1</span>🔊 Hear it</div>
    <div id="btnHint2" class="btn fx" data-act="hint2"><span class="key">2</span>🔤 Spell it</div>
    <div id="btnMap" class="btn fx" data-act="tomap">🗺️ Map</div>
    <div id="lvlTitle" class="pill"></div>
    <div id="lvlPoints" class="pill"></div>
    <div id="cards"></div>
  </section>

  <!-- ======================= WARDROBE ======================= -->
  <section id="wardrobe" class="screen">
    <div class="sky"></div>
    <div id="wardMirror"><div class="glass"></div><div id="wardAlice"></div><div class="frame"></div></div>
    <div id="wardTitle" class="ribbon">Alice's Wardrobe</div>
    <div id="btnWardBack" class="btn fx" data-act="tomap">🗺️ Map</div>
    <div id="wardPoints" class="pill"></div>
    <div id="wardTabs"></div>
    <div id="wardGrid"></div>
    <div id="wardMsg" class="pill"></div>
  </section>

  <div id="overlay"><div id="ovAlice"></div><img id="ovArt" class="art" src="art/herald.webp" alt=""><div id="ovBig"></div><div id="ovWord"></div><div id="ovStars"></div><div id="ovPts"></div></div>
</div>

<script src="wardrobe.js"></script>
<script>
"use strict";
/* =====================================================================
   WORDS: 8 Wonderland stops, 5 words each, getting longer as you go
   ===================================================================== */
const WORLDS = [
  {name:"Down the Rabbit Hole",   icons:["🐇","🕳️","🕰️"], tint:"#d9cdf5", words:[["cat","🐈"],["dog","🐕"],["cow","🐄"],["sun","☀️"],["hat","🎩"]], pics:[["car","🚗"],["bus","🚌"]]},
  {name:"The Hall of Tiny Doors", icons:["🚪","🗝️","🧁"], tint:"#c7ece6", words:[["key","🔑"],["egg","🥚"],["bee","🐝"],["cup","☕"],["pig","🐖"]], pics:[["ant","🐜"],["bed","🛏️"]]},
  {name:"The Pool of Tears",      icons:["💧","🐭","🦆"], tint:"#bfe0fb", words:[["fish","🐟"],["duck","🦆"],["frog","🐸"],["boat","⛵"],["star","⭐"]], pics:[["crab","🦀"],["ship","🚢"]]},
  {name:"The Caterpillar's Mushroom", icons:["🍄","🐛","🌿"], tint:"#d3efc0", words:[["moon","🌙"],["rose","🌹"],["tree","🌳"],["book","📖"],["cake","🍰"]], pics:[["snail","🐌"],["leaf","🍃"]]},
  {name:"The Cheshire Cat's Grove", icons:["😸","🌳","🌙"], tint:"#e6cdf0", words:[["baby","👶"],["bird","🐦"],["bear","🐻"],["lion","🦁"],["ball","⚽"]], pics:[["owl","🦉"],["fox","🦊"]]},
  {name:"The Mad Tea Party",      icons:["☕","🎩","🍰"], tint:"#fbd3e1", words:[["apple","🍎"],["clock","🕰️"],["mouse","🐭"],["shirt","👕"],["crown","👑"]], pics:[["spoon","🥄"],["bread","🍞"]]},
  {name:"The Queen's Croquet Garden", icons:["🌹","🃏","🦔"], tint:"#f8cfcf", words:[["heart","❤️"],["horse","🐎"],["sheep","🐑"],["house","🏠"],["dress","👗"]], pics:[["pear","🍐"],["train","🚂"]]},

   ===================================================================== */
/* Progress is stored by level name ("s:cat", "p:car"), not position, so new levels never lose progress.
   In memory: save.unlocked = furthest level open, save.stars[index] = stars earned. */
const OLD_ORDER = WORLDS.flatMap(w=>w.words.map(([word])=>"s:"+word));   // build 1-2 saved by position in this list
const Store = {
  read(){ try{ return window.AndroidStore ? AndroidStore.get() : localStorage.getItem("am_save"); }catch(e){ return null; } },
  get(){
    const fresh={unlocked:0, stars:{}, points:0, music:true, owned:{}, look:cleanLook({})};
    let raw=this.read(); if(!raw) return fresh;
    let d; try{ d=JSON.parse(raw); }catch(e){ return fresh; }
    if(!d || typeof d!=="object") return fresh;
    const out={unlocked:0, stars:{}, points:+d.points||0, music:d.music!==false, owned:(d.owned&&typeof d.owned==="object")?d.owned:{}, look:cleanLook(d.look)};
    if(!d.art2 && out.look.dressColor==="rose") out.look.dressColor="alice";   // the storybook update: her dress starts blue
    let done={}, frontier=null;
    if(d.v===2){ done=d.done||{}; frontier=d.frontier; }
    else { // first version: stars and unlocked by position among the 40 spelling words
      for(const k in (d.stars||{})){ const id=OLD_ORDER[+k]; if(id) done[id]=d.stars[k]; }
      frontier=OLD_ORDER[d.unlocked]||null;
    }
    let furthest=-1;
    for(const id in done){ const i=LEVEL_INDEX[id]; if(i!==undefined){ out.stars[i]=done[id]; furthest=Math.max(furthest,i); } }
    const fi = frontier && LEVEL_INDEX[frontier]!==undefined ? LEVEL_INDEX[frontier] : 0;
    out.unlocked=Math.min(LEVELS.length-1, Math.max(fi, furthest+1));
    return out;
  },
  set(s){
    const done={}; for(const i in s.stars){ if(LEVELS[i]) done[LEVELS[i].id]=s.stars[i]; }
    const raw=JSON.stringify({v:2, done, frontier:LEVELS[s.unlocked].id, points:s.points, music:s.music, owned:s.owned, look:s.look, art2:true});
    try{ if(window.AndroidStore) AndroidStore.set(raw); else localStorage.setItem("am_save",raw); }catch(e){}
  }
};

/* =====================================================================
   SOUND: music-box waltz + gentle effects, all synthesized
   ===================================================================== */
const Snd = {
  ctx:null, master:null, music:null, sfx:null, verb:null, timer:null, nextT:0, step:0, duck:1,
  /* On the TV every sound is a real audio file played by Android (window.AndroidSfx), which never stutters when
     the screen is busy. The synth below is only used when the game runs in a web browser. */
  native: !!window.AndroidSfx,
  init(){
    if(this.native) return;
    if(this.ctx){ if(this.ctx.state!=="running") this.ctx.resume().catch(()=>{}); return; }
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value=.9; this.master.connect(c.destination);
    this.music=c.createGain(); this.music.gain.value=0; this.music.connect(this.master);
    this.sfx=c.createGain(); this.sfx.gain.value=.6; this.sfx.connect(this.master);
    this.buildSong(); this.nextT=c.currentTime+.2;
    this.timer=setInterval(()=>this.tick(),60);
    this.applyMusic(.6);
  },
  ext:false,   // true while songs from the music folder are playing (the app plays them; the waltz rests)
  setMusic(on){ save.music=on; Store.set(save);
    try{ if(window.AndroidMusic) AndroidMusic.setEnabled(on); }catch(e){}
    this.applyMusic(.6); },
  applyMusic(fade){ if(!this.ctx) return; const on=save.music && !this.ext;
    const g=this.music.gain, t=this.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
    g.linearRampToValueAtTime(on? .16*this.duck : 0, t+fade); },
  setDuck(d){ this.duck=d; try{ if(window.AndroidMusic) AndroidMusic.duck(d<1); }catch(e){} this.applyMusic(.25); },
  // an original little waltz in C (3/4). [midi, beats]
  buildSong(){
    const mel=[[[76,1],[79,1],[84,1]],[[83,2],[81,1]],[[79,1],[76,1],[72,1]],[[74,3]],
               [[77,1],[81,1],[86,1]],[[84,2],[83,1]],[[81,1],[77,1],[74,1]],[[79,3]],
               [[76,1],[79,1],[84,1]],[[88,2],[86,1]],[[84,1],[81,1],[77,1]],[[76,2],[79,1]],
               [[77,1],[74,1],[71,1]],[[72,1],[76,1],[79,1]],[[74,1],[79,1],[83,1]],[[84,3]]];
    const chords=[[48,52,55],[43,47,50],[48,52,55],[43,47,50],[50,53,57],[43,47,50],[50,53,57],[43,47,50],
                  [48,52,55],[48,52,55],[41,45,48],[48,52,55],[43,47,50],[48,52,55],[43,47,50],[48,52,55]];
    const ev=[]; let beat=0;
    mel.forEach((bar,bi)=>{ let b=beat; bar.forEach(([m,d])=>{ev.push({b,m,v:.55,d:d});b+=d;});
      const ch=chords[bi]; ev.push({b:beat,m:ch[0]-12+12,v:.35,d:3}); ev.push({b:beat+1,m:ch[1]+12,v:.18,d:1}); ev.push({b:beat+1,m:ch[2]+12,v:.15,d:1});
      ev.push({b:beat+2,m:ch[1]+12,v:.15,d:1}); ev.push({b:beat+2,m:ch[2]+12,v:.13,d:1}); beat+=3; });
    // a quiet bar of rest before it loops
    this.song=ev.sort((a,b)=>a.b-b.b); this.songLen=beat+3; this.beatSec=60/88;
  },
  tick(){
    const c=this.ctx; if(!c) return;
    while(this.nextT < c.currentTime+.4){
      const loopStart=this.nextT, evs=this.song;
      // schedule one whole loop at a time
      evs.forEach(e=>this.tine(this.music, loopStart+e.b*this.beatSec, e.m, e.v, 1.8));
      this.nextT += this.songLen*this.beatSec;
    }
  },
  tine(dest,t,m,v,len){ const c=this.ctx,f=440*Math.pow(2,(m-69)/12);
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0008,t+len);
    const o=c.createOscillator(); o.type="sine"; o.frequency.value=f; o.connect(g);
    const g2=c.createGain(); g2.gain.setValueAtTime(v*.35,t); g2.gain.exponentialRampToValueAtTime(.0005,t+.25);
    const o2=c.createOscillator(); o2.type="sine"; o2.frequency.value=f*4.02; o2.connect(g2);
    g.connect(dest); g2.connect(dest); o.start(t); o2.start(t); o.stop(t+len+.05); o2.stop(t+.3); },
  play(kind){
    if(this.native){ if(kind==="move"){ this.mi=((this.mi||0)+1+Math.floor(Math.random()*2))%8; kind="move"+this.mi; }
      try{ AndroidSfx.play(kind); }catch(e){} return; }
    const c=this.ctx; if(!c) return; const t=c.currentTime+.01;
    if(kind==="move"){ // a bubbly "bloop" that hops around a happy scale
      const scale=[72,74,76,79,81,84,86,88]; this.mi=((this.mi||0)+1+Math.floor(Math.random()*2))%scale.length;
      const f=440*Math.pow(2,(scale[this.mi]-69)/12), o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.setValueAtTime(f*.75,t); o.frequency.exponentialRampToValueAtTime(f*1.35,t+.07); o.frequency.exponentialRampToValueAtTime(f,t+.13);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.012); g.gain.exponentialRampToValueAtTime(.001,t+.2);
      o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t+.22);
      this.tine(this.sfx,t+.03,scale[this.mi]+12,.05,.25); }
    else if(kind==="hop"){ [0,1,2].forEach(k=>{ const o=c.createOscillator(), g=c.createGain(), tt=t+k*.09, f=520+k*140;
      o.type="triangle"; o.frequency.setValueAtTime(f,tt); o.frequency.exponentialRampToValueAtTime(f*1.8,tt+.08);
      g.gain.setValueAtTime(.12,tt); g.gain.exponentialRampToValueAtTime(.001,tt+.12); o.connect(g); g.connect(this.sfx); o.start(tt); o.stop(tt+.13); }); }
    else if(kind==="right"){ this.tine(this.sfx,t,84,.35,1); this.tine(this.sfx,t+.09,91,.3,1.2); }
    else if(kind==="bzz"){ // gentle low buzz
      const o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain();
      o.type="sawtooth"; o.frequency.setValueAtTime(150,t); o.frequency.linearRampToValueAtTime(120,t+.35);
      lfo.frequency.value=28; lg.gain.value=10; lfo.connect(lg); lg.connect(o.frequency);
      f.type="lowpass"; f.frequency.value=520;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.03); g.gain.linearRampToValueAtTime(.18,t+.25); g.gain.exponentialRampToValueAtTime(.001,t+.42);
      o.connect(f); f.connect(g); g.connect(this.master); o.start(t); lfo.start(t); o.stop(t+.45); lfo.stop(t+.45); }
    else if(kind==="win"){ [72,76,79,84,88,91,96].forEach((m,i)=>this.tine(this.sfx,t+i*.09,m,.32,1.6)); }
    else if(kind==="step"){ this.tine(this.sfx,t,79,.18,.4); this.tine(this.sfx,t+.12,84,.18,.5); }
    else if(kind==="start"){ [67,72,76,79].forEach((m,i)=>this.tine(this.sfx,t+i*.07,m,.25,1.2)); }
  }
};

/* =====================================================================
   SPEECH: Android TextToSpeech through the app, else the browser's voice
   ===================================================================== */
const TTS = {
  seq:0, waiters:{},
  say(text, rate){ rate=rate||.9;
    return new Promise(res=>{
      const id="u"+(++this.seq); let done=false;
      const fin=()=>{ if(done) return; done=true; delete this.waiters[id]; res(); };
      this.waiters[id]=fin;
      setTimeout(fin, 1800 + text.length*260/rate);       // never hang if no "done" arrives
      try{
        if(window.AndroidTTS){ AndroidTTS.speak(text, rate, id); }
        else if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(text); u.rate=rate; u.pitch=1.15; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); }
        else setTimeout(fin,700);
      }catch(e){ setTimeout(fin,700); }
    });
  },
  /* a letter by its name: the app's spell-out mode, else the capital letter for the browser's voice */
  letter(ch, rate){ rate=rate||.9;
    return new Promise(res=>{
      const id="u"+(++this.seq); let done=false;
      const fin=()=>{ if(done) return; done=true; delete this.waiters[id]; res(); };
      this.waiters[id]=fin; setTimeout(fin, 2200);
      try{
        if(window.AndroidTTS && AndroidTTS.speakLetter){ AndroidTTS.speakLetter(ch, rate, id); }
        else if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(ch.toUpperCase()); u.rate=rate; u.pitch=1.15; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); }
        else setTimeout(fin,700);
      }catch(e){ setTimeout(fin,700); }
    });
  },
  stop(){ try{ if(window.AndroidTTS) AndroidTTS.stop(); else if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
    Object.values(this.waiters).forEach(f=>f()); }
};
window.__ttsDone = id => { const f=TTS.waiters[id]; if(f) f(); };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
window.__extMusic = on => { Snd.ext=!!on; Snd.applyMusic(1.2); };

/* Fit the 1600x900 stage to the screen. TVs report sizes in different units (innerWidth can be physical pixels
   while CSS uses density pixels), so measure a 100vw x 100vh box in the same CSS pixels the stage is drawn in. */
const probe=document.createElement("div");
probe.style.cssText="position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;visibility:hidden";
document.body.appendChild(probe);
let lastFit="";
function fitStage(){
  const r=probe.getBoundingClientRect();
  let w=r.width, h=r.height;
  const de=document.documentElement;
  if(de.clientWidth>0) w=Math.min(w,de.clientWidth);
  if(de.clientHeight>0) h=Math.min(h,de.clientHeight);
  if(window.visualViewport && visualViewport.width>0){ w=Math.min(w,visualViewport.width); h=Math.min(h,visualViewport.height); }
  if(!(w>0&&h>0)) return;
  const key=w+"x"+h; if(key===lastFit) return; lastFit=key;
  const s=Math.min(w/1600,h/900), st=$("stage");
  st.style.transform=`scale(${s})`; st.style.left=((w-1600*s)/2)+"px"; st.style.top=((h-900*s)/2)+"px";
}
window.fit=()=>{ lastFit=""; fitStage(); };
addEventListener("resize",fitStage); addEventListener("load",window.fit);
if(window.visualViewport) visualViewport.addEventListener("resize",fitStage);
setInterval(fitStage,700); fitStage();

function show(name){ fitStage(); document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===name)); screen=name; }
function focusables(){ return [...document.querySelectorAll(`#${screen} .fx`)].filter(e=>!e.classList.contains("gone") && e.offsetParent!==null); }
function setFocus(el, sound){ if(focusEl===el) return; if(focusEl) focusEl.classList.remove("focus"); focusEl=el; if(el){ el.classList.add("focus"); if(sound) Snd.play("move"); wardFocus(el); } }
function center(el){ const r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
function moveFocus(dir){
  const list=focusables(); if(!list.length) return;
  if(!focusEl || !list.includes(focusEl)){ setFocus(list[0],true); return; }
  const c=center(focusEl); let best=null, bs=1e9;
  list.forEach(e=>{ if(e===focusEl) return; const p=center(e), dx=p.x-c.x, dy=p.y-c.y;
    let main, side;
    if(dir==="left"){main=-dx;side=Math.abs(dy);} else if(dir==="right"){main=dx;side=Math.abs(dy);}
    else if(dir==="up"){main=-dy;side=Math.abs(dx);} else {main=dy;side=Math.abs(dx);}
    if(main<8) return; const s=main+side*2.2; if(s<bs){bs=s;best=e;} });
  if(best) setFocus(best,true);
}
function nearestTo(el){ const list=focusables().filter(e=>e!==el && e.classList.contains("card")); if(!list.length) return $("btnHint1");
  const c=center(el); let best=list[0],bd=1e9; list.forEach(e=>{const p=center(e),d=Math.hypot(p.x-c.x,p.y-c.y); if(d<bd){bd=d;best=e;}}); return best; }

/* one entry point for every input: "up","down","left","right","ok","back","hint1","hint2" */
function input(k){
  Snd.init();
  if(overlayOn){ if(k==="ok"||k==="back") skipOverlay(); return true; }
  if(screen==="map") return mapInput(k);
  if(k==="back"){
    if(screen==="level"||screen==="wardrobe"){ goMap(); return true; }
    return false;                       // on the title screen Back leaves the app
  }
  if(k==="hint1" && screen==="level"){ hint1(); return true; }
  if(k==="hint2" && screen==="level"){ hint2(); return true; }
  if(k==="ok"){ if(focusEl) activate(focusEl); return true; }
  if(["up","down","left","right"].includes(k)){ moveFocus(k); return true; }
  return false;
}
window.tvKey = k => input(k);           // called by the Android app

  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",Enter:"ok"," ":"ok",
             Escape:"back",Backspace:"back","1":"hint1","2":"hint2"};

/* browser Gamepad API (the Android app sends controller buttons as keys instead) */
let padPrev={}, padHeld={}, padT={};
function pollPads(){
  const pads=navigator.getGameControllers ? navigator.getGameControllers() : (navigator.getGamepads? navigator.getGamepads():[]);
  for(const p of pads||[]){ if(!p) continue;
    const b=i=>p.buttons[i]&&p.buttons[i].pressed, ax=p.axes||[];
    const st={ok:b(0),back:b(1),hint1:b(2),hint2:b(3),up:b(12)||ax[1]<-.6,down:b(13)||ax[1]>.6,left:b(14)||ax[0]<-.6,right:b(15)||ax[0]>.6};
    const now=performance.now();
    for(const k in st){ if(st[k] && !padPrev[k]){ input(k); padT[k]=now+380; }
      else if(st[k] && ["up","down","left","right"].includes(k) && now>padT[k]){ input(k); padT[k]=now+160; } }
    padPrev=st; }
  requestAnimationFrame(pollPads);
}
requestAnimationFrame(pollPads);

function activate(el){
  const a=el.dataset.act;
  if(a==="play"){ Snd.play("start"); goMap(); }
  else if(a==="reset"){
    if(el.dataset.armed){ save={unlocked:0,stars:{},points:0,music:save.music,owned:{},look:cleanLook({})}; refreshAlice(); Store.set(save); delete el.dataset.armed;
      el.innerHTML="✓ Fresh start!"; buildMap(); Snd.play("start"); setTimeout(()=>el.innerHTML="↺ Start over",1500); }
    else { el.dataset.armed="1"; el.innerHTML="Press again to erase"; setTimeout(()=>{delete el.dataset.armed; el.innerHTML="↺ Start over";},3000); }
  }
  else if(a==="music"){ Snd.setMusic(!save.music); el.innerHTML="♪ Music: "+(save.music?"On":"Off"); }
  else if(a==="folder"){ try{ AndroidMusic.openSettings(); }catch(e){} }
  else if(a==="wardrobe"){ Snd.play("start"); goWardrobe(); }
  else if(el.dataset.tab) showWardTab(el.dataset.tab);
  else if(el.dataset.item) wardPick(el);
  else if(a==="hint1") hint1();
  else if(a==="hint2") hint2();
  else if(a==="tomap") goMap();
  else if(el.classList.contains("card")) pickCard(el);
}

   ===================================================================== */
let nodePos=[], mapSel=0, mapW=0;
const LOCK=`<svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="#2e2016" stroke-width="2.4"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#e0ab35" stroke="#2e2016" stroke-width="2"/><circle cx="12" cy="16" r="1.8" fill="#2e2016"/></svg>`;
/* Tenniel's 1865 engravings (public domain), hand-tinted, for each stop on the map: [file, height] */
const WORLD_ART=[[["rabbit",340]],[["curtain",300],["drinkme",270]],[["pool",250]],[["caterpillar",330]],[["cheshire",340]],[["teaparty",270],["hatter",230]],[["flamingo",320],["gardeners",260]],[["herald",320],["cards",260]]];
const WORLD_WASH=["#c9b6ea","#9fd6cb","#9ccbee","#b5dc98","#d7b2e6","#f4b3c6","#f2b0a6","#f3d37f"];
function buildMap(){
  const world=$("mapWorld"); world.innerHTML=""; nodePos=[];
  let x=230;
  LEVELS.forEach((lv,i)=>{ if(i>0 && LEVELS[i-1].w!==lv.w) x+=150; nodePos.push({x, y:520+150*Math.sin(i*.9)}); x+=210; });
  mapW=x+200; world.style.width=mapW+"px";
  // regions
  WORLDS.forEach((w,wi)=>{
    const idx=LEVELS.map((l,i)=>l.w===wi?i:-1).filter(i=>i>=0), first=idx[0], last=idx[idx.length-1];
    const x0=first===0?0:(nodePos[first-1].x+nodePos[first].x)/2, x1=last===LEVELS.length-1?mapW:(nodePos[last].x+nodePos[last+1].x)/2;
    const r=document.createElement("div"); r.className="region";
    r.style.left=x0+"px"; r.style.width=(x1-x0)+"px";
    r.style.background=`radial-gradient(ellipse 62% 56% at 50% 60%, ${WORLD_WASH[wi]}ee, ${WORLD_WASH[wi]}55 60%, transparent 80%)`;
    world.appendChild(r);
    const b=document.createElement("div"); b.className="ribbon wbanner"; b.textContent=w.name; b.style.left=(Math.max(x0+260,(x0+x1)/2))+"px"; world.appendChild(b);
    WORLD_ART[wi].forEach(([file,h],k)=>{ const e=document.createElement("img"); e.className="land"; e.src=`art/${file}.webp`; e.alt="";
      e.style.height=h+"px"; e.style.top=(k%2? 866-h : 158)+"px";
      if(k%2) e.style.left=(x1-520)+"px"; else e.style.left=(x0+ (WORLD_ART[wi].length>1? 60 : 120))+"px";
      world.appendChild(e); });
  });
  // path
  const svgNS="http://www.w3.org/2000/svg", svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("width",mapW); svg.setAttribute("height",900); svg.style.position="absolute"; svg.style.left=0; svg.style.top=0;
  let d=`M ${nodePos[0].x-200} ${nodePos[0].y}`;
  nodePos.forEach((p,i)=>{ const prev=i?nodePos[i-1]:{x:p.x-200,y:p.y}, mx=(prev.x+p.x)/2; d+=` C ${mx} ${prev.y}, ${mx} ${p.y}, ${p.x} ${p.y}`; });
  const mk=(w,col,dash)=>{ const pa=document.createElementNS(svgNS,"path"); pa.setAttribute("d",d); pa.setAttribute("fill","none");
    pa.setAttribute("stroke",col); pa.setAttribute("stroke-width",w); pa.setAttribute("stroke-linecap","round"); if(dash) pa.setAttribute("stroke-dasharray",dash); svg.appendChild(pa); };
  mk(44,"#2e2016"); mk(38,"#f6e6bd"); mk(4,"#b9382f","3 16");
  world.appendChild(svg);
  // little card-suit stepping stones between nodes
  LEVELS.forEach((lv,i)=>{
    const p=nodePos[i], n=document.createElement("div"); n.className="node"; n.dataset.i=i;
    world.appendChild(n); n.style.left=p.x+"px"; n.style.top=p.y+"px"; });
  const a=document.createElement("div"); a.id="mapAlice"; a.innerHTML=aliceSVG(save.look); world.appendChild(a);
  refreshMap(false);
}
function refreshMap(animate){
  document.querySelectorAll(".node").forEach(n=>{ const i=+n.dataset.i, lv=LEVELS[i], st=save.stars[i];
    n.className="node"+(i>save.unlocked?" locked":"")+(st?" done":"")+(i===save.unlocked?" current":"")+(i===mapSel?" sel":"");
    n.innerHTML = (i>save.unlocked ? LOCK : (st ? lv.pic : (i+1))) + (st? `<div class="stars">${"★".repeat(st)}</div>`:"")
      + (lv.kind==="pick" ? `<div class="badge">♥\uFE0E</div>` : "");
  });
  const a=$("mapAlice"), p=nodePos[mapSel];
  if(!animate){ a.style.transition="none"; }
  a.style.left=p.x+"px"; a.style.top=p.y+"px";
  if(!animate){ void a.offsetWidth; a.style.transition=""; }
  const cam=Math.max(0,Math.min(mapW-1600,p.x-800)); const w=$("mapWorld");
  if(!animate){ w.style.transition="none"; } w.style.transform=`translateX(${-cam}px)`; if(!animate){ void w.offsetWidth; w.style.transition=""; }
  $("mapPoints").innerHTML=HRT+" "+save.points;
}
function selectNode(i){ if(i<0||i>save.unlocked||i>=LEVELS.length||i===mapSel) return false; mapSel=i; Snd.play("hop");
  $("mapAlice").classList.remove("hop"); void $("mapAlice").offsetWidth; $("mapAlice").classList.add("hop"); refreshMap(true); return true; }
function goMap(){ TTS.stop(); busy=false; setFocus(null); show("map");
  mapSel=Math.min(mapSel, save.unlocked); refreshMap(false); refreshAlice(); }
function mapInput(k){
  const wb=$("btnWardrobe");
  if(focusEl===wb){                       // the Wardrobe button under the path
    if(k==="ok"){ Snd.play("start"); goWardrobe(); }
    else if(k==="back") goTitle();
    else { setFocus(null); Snd.play("move"); }
    return true;
  }
  if(k==="down"){ setFocus(wb,true); return true; }
  if(k==="left"||k==="up") selectNode(mapSel-1);
  else if(k==="right"||k==="down") selectNode(mapSel+1);
  else if(k==="ok") startLevel(mapSel);
  else if(k==="back") goTitle();
  return true;
}

/* =====================================================================
   LEVEL
   ===================================================================== */
let cur=null;   // {i, word, filled, mistakes}
const SLOTS=[]; // 40 card positions, 4x5 on each side of the mirror
for(let side=0;side<2;side++) for(let r=0;r<5;r++) for(let c=0;c<4;c++)
  SLOTS.push({x:(side? 1112:36)+c*114, y:112+r*146});

function startLevel(i){
  const lv=LEVELS[i]; mapSel=i;
  cur={i, word:lv.word, kind:lv.kind, filled:0, mistakes:0};
  show("level"); busy=false;
  $("lvlTitle").textContent = lv.kind==="pick" ? `Level ${i+1} · Find the picture!` : `Level ${i+1} · ${WORLDS[lv.w].name}`;
  $("lvlPoints").innerHTML=HRT+" "+save.points;
  const pic=$("pic"); pic.textContent = lv.kind==="pick" ? "❔" : lv.pic; pic.classList.remove("pop"); void pic.offsetWidth; pic.classList.add("pop");
  if(lv.kind==="pick"){ startPickLevel(lv); return; }
  // blank lines
  const sl=$("slots"); sl.innerHTML=""; const n=lv.word.length, w=78, gap=16, tot=n*w+(n-1)*gap, x0=(600-tot)/2;
  for(let k=0;k<n;k++){ const s=document.createElement("div"); s.className="slot"+(k===0?" next":""); s.style.left=(x0+k*(w+gap))+"px"; s.style.top="0px"; sl.appendChild(s); }
  // the whole alphabet + extra copies for repeated letters
  const counts={}; for(const ch of lv.word) counts[ch]=(counts[ch]||0)+1;
  const deck="abcdefghijklmnopqrstuvwxyz".split("");
  for(const ch in counts) for(let k=1;k<counts[ch];k++) deck.push(ch);
  const spots=SLOTS.map(s=>s).sort(()=>Math.random()-.5);
  const cards=$("cards"); cards.innerHTML="";
  deck.sort(()=>Math.random()-.5).forEach((ch,k)=>{ const c=makeCard(ch,Math.floor(Math.random()*4)), s=spots[k];
    c.style.left=(s.x+(Math.random()*20-10))+"px"; c.style.top=(s.y+(Math.random()*18-9))+"px";
    c.style.setProperty("--rot",(Math.random()*18-9).toFixed(1)+"deg"); cards.appendChild(c); });
  setFocus($("btnHint1"));
}
function slotEls(){ return [...$("slots").children]; }

/* FIND THE PICTURE: the word is spelled out, the cards show pictures, pick the one that matches */
const PIC_SPOTS=[{x:64,y:140},{x:290,y:170},{x:84,y:470},{x:300,y:500},{x:1160,y:150},{x:1384,y:130},{x:1150,y:480},{x:1370,y:460}];
function startPickLevel(lv){
  const sl=$("slots"); sl.innerHTML=""; const n=lv.word.length, w=78, gap=16, tot=n*w+(n-1)*gap, x0=(600-tot)/2;
  for(let k=0;k<n;k++){ const d=document.createElement("div"); d.className="slot filled"; d.textContent=lv.word[k].toUpperCase();
    d.style.left=(x0+k*(w+gap))+"px"; d.style.top="0px"; sl.appendChild(d); }
  // the right picture + 7 others, never two of the same picture or a look-alike word
  const others=ALL_PICS.filter(([word,pic])=>pic!==lv.pic && word!==lv.word).sort(()=>Math.random()-.5).slice(0,7);
  const hand=[[lv.word,lv.pic],...others].sort(()=>Math.random()-.5);
  const cards=$("cards"); cards.innerHTML="";
  hand.forEach(([word,pic],k)=>{ const c=makePicCard(word,pic,k), sp=PIC_SPOTS[k];
    c.style.left=(sp.x+(Math.random()*16-8))+"px"; c.style.top=(sp.y+(Math.random()*16-8))+"px";
    c.style.setProperty("--rot",(Math.random()*14-7).toFixed(1)+"deg"); cards.appendChild(c); });
  setFocus($("btnHint1"));
}
async function pickPicture(card){
  const got=card.dataset.word;
  if(got!==cur.word){
    cur.mistakes++; Snd.play("bzz"); card.classList.remove("wrong"); void card.offsetWidth; card.classList.add("wrong");
    busy=true; await sleep(350); await TTS.say("That's a "+got,.9); busy=false;   // learn the word for that picture too
    return;
  }
  busy=true; Snd.play("right");
  card.classList.add("flying"); card.style.left=(800-75)+"px"; card.style.top=(318-105)+"px";
  document.querySelectorAll("#cards .card").forEach(c=>{ if(c!==card) c.style.opacity=".35"; });
  setFocus(null);
  await sleep(600);
  card.classList.add("gone");
  const pic=$("pic"); pic.textContent=LEVELS[cur.i].pic; pic.classList.remove("pop"); void pic.offsetWidth; pic.classList.add("pop");
  levelDone();
}

async function pickCard(card){
  if(busy || !cur) return;
  if(cur.kind==="pick") return pickPicture(card);
  const want=cur.word[cur.filled], got=card.dataset.letter;
  if(got!==want){ cur.mistakes++; Snd.play("bzz"); card.classList.remove("wrong"); void card.offsetWidth; card.classList.add("wrong"); return; }
  busy=true; Snd.play("right");
  const k=cur.filled, slot=slotEls()[k];
  const next=nearestTo(card);
  // fly the card into its spot
  const sx=500+parseFloat(slot.style.left)-7, sy=552-14;
  card.classList.add("flying"); card.style.left=sx+"px"; card.style.top=sy+"px";
  setFocus(next);
  const spoken=TTS.letter(got,.9);
  await sleep(560);
  card.classList.add("gone"); card.classList.remove("flying");
  slot.textContent=got.toUpperCase(); slot.classList.add("filled"); slot.classList.remove("next");
  cur.filled++;
  if(cur.filled<cur.word.length){ slotEls()[cur.filled].classList.add("next"); busy=false; }
  else { await spoken; levelDone(); }      // let the last letter finish, so the word isn't spoken over it
}

async function hint1(){ if(busy||!cur) return; busy=true; $("btnHint1").classList.add("busy"); Snd.setDuck(.25);
  await TTS.say(cur.word,.65); await sleep(250);
  Snd.setDuck(1); $("btnHint1").classList.remove("busy"); busy=false; }

async function hint2(){ if(busy||!cur) return; busy=true; $("btnHint2").classList.add("busy"); Snd.setDuck(.25);
  const sl=slotEls();
  for(let k=0;k<cur.word.length;k++){ if(screen!=="level") break;
    sl[k].classList.add("hl"); await TTS.letter(cur.word[k],.85); await sleep(120); sl[k].classList.remove("hl"); }
  Snd.setDuck(1); $("btnHint2").classList.remove("busy"); busy=false; }

/* =====================================================================
   CELEBRATION + MOVING ON
   ===================================================================== */
let overlayOn=false, overlaySkip=null;
function skipOverlay(){ if(overlaySkip) overlaySkip(); }
function confetti(n){ const st=$("stage"); const bits=["♥","♠","♦","♣"];
  for(let k=0;k<n;k++){ const e=document.createElement("div"); e.className="confetti"+(k%2?"":" red"); e.textContent=bits[k%4]+"\uFE0E";
    e.style.left=(Math.random()*1560)+"px"; e.style.animationDuration=(2.4+Math.random()*2)+"s"; e.style.animationDelay=(Math.random()*.8)+"s";
    st.appendChild(e); setTimeout(()=>e.remove(),5400); } }

async function levelDone(){
  const i=cur.i, m=cur.mistakes, stars=m===0?3:(m<=(cur.kind==="pick"?1:2)?2:1), pts=10+(m===0?5:0);
  const first=!save.stars[i];
  save.stars[i]=Math.max(save.stars[i]||0,stars); save.points+=pts;
  const isLast=i===LEVELS.length-1;
  if(i===save.unlocked && !isLast) save.unlocked=i+1;
  Store.set(save);
  $("lvlPoints").innerHTML=HRT+" "+save.points;
  Snd.play("win"); confetti(26);
  const praise=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  overlayOn=true; $("overlay").classList.add("on");
  $("ovBig").textContent=isLast? "Queen of Wonderland!" : praise;
  $("ovWord").textContent=cur.word.toUpperCase();
  $("ovStars").innerHTML=[0,1,2].map(k=>`<span style="animation-delay:${.3+k*.25}s;" class="${k<stars?"":"off"}">★</span>`).join("");
  const nw=cheapestNew(save); refreshAlice();
  $("ovPts").innerHTML=`+${pts} ${HRT}` + (nw && nw.price<=save.points ? "  ·  New things in the wardrobe!" : "");
  let skipped=false; const wait=new Promise(r=>{ overlaySkip=()=>{skipped=true;r();}; });
  /* The fanfare plays first, then the word, then the praise, each one finishing before the next starts. The
     celebration stays up until the voice is done (or OK is pressed) instead of cutting it off on a timer. */
  const word=cur.word;
  const speech=(async()=>{ await sleep(900); if(skipped) return; Snd.setDuck(.3);
    await TTS.say(word,.75); if(skipped) return; await sleep(150);
    await TTS.say(isLast?"You are the Queen of Wonderland!":praise,.95); })();
  await Promise.race([wait, Promise.all([speech, sleep(isLast?5000:3000)]), sleep(12000)]);
  if(!skipped) await sleep(350);
  skipped=true; overlayOn=false; overlaySkip=null; $("overlay").classList.remove("on"); TTS.stop(); Snd.setDuck(1);
  // back to the map, Alice walks on, and the next word starts by itself
  goMap();
  if(isLast){ confetti(60); return; }
  await sleep(450);
  selectNode(i+1);
  await sleep(1300);
  if(screen==="map" && mapSel===i+1) startLevel(i+1);
}

/* =====================================================================
   GO
   ===================================================================== */
if(window.AndroidMusic){ document.body.classList.add("app"); try{ AndroidMusic.setEnabled(save.music); }catch(e){} }
buildTitle(); buildMap(); mapSel=Math.min(save.unlocked,LEVELS.length-1); goTitle();
</script>
